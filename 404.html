<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Not Found</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d15;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 70, 70, 0.10) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(88, 101, 242, 0.06) 0%, transparent 50%);
            padding: 20px;
            position: relative;
        }

        /* Fundo animado */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.02) 0%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(255, 70, 70, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: shimmer 30s infinite alternate ease-in-out;
        }

        @keyframes shimmer {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(2%, 1%) rotate(3deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(18, 22, 33, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 60px 50px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
        }

        /* Código 404 com efeito neon vermelho */
        .code {
            font-size: 96px;
            font-weight: 800;
            letter-spacing: -4px;
            background: linear-gradient(135deg, #ff3b3b 0%, #ff7a7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-shadow: 0 0 40px rgba(255, 50, 50, 0.3);
            display: inline-block;
            animation: glowRed 3s infinite alternate;
            line-height: 1;
        }

        @keyframes glowRed {
            0% { text-shadow: 0 0 20px rgba(255, 50, 50, 0.2); }
            100% { text-shadow: 0 0 60px rgba(255, 50, 50, 0.5), 0 0 100px rgba(255, 50, 50, 0.15); }
        }

        .sub {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 20px;
        }

        .sub span {
            color: rgba(255, 255, 255, 0.5);
        }

        .message {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 36px;
            font-weight: 400;
        }

        .message strong {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
        }

        /* Botão home – estilo coerente com o index, porém em tom neutro */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 60px;
            padding: 14px 32px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-decoration: none;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #2a2e3f 0%, #1e2233 100%);
        }

        .btn-home::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .btn-home:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, #32374a 0%, #25293e 100%);
        }

        .btn-home:hover::after {
            opacity: 1;
        }

        .btn-home:active {
            transform: scale(0.97);
        }

        .btn-home svg {
            width: 18px;
            height: 18px;
            fill: rgba(255, 255, 255, 0.6);
            transition: fill 0.2s;
        }

        .btn-home:hover svg {
            fill: #fff;
        }

        .footer {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 12px;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
                border-radius: 24px;
            }
            .code {
                font-size: 68px;
            }
            .sub {
                font-size: 12px;
                letter-spacing: 2px;
            }
            .message {
                font-size: 14px;
            }
            .btn-home {
                font-size: 14px;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="code">404</div>
        <div class="sub">page <span>·</span> not found</div>

        <div class="message">
            Oops! The page you're looking for<br>
            doesn't exist or was moved.
        </div>

        <a class="btn-home" href="/">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            Go Home
        </a>

        <div class="footer">
            <span>✧</span> <a href="#">protected</a> · <a href="#">support</a>
        </div>
    </div>

</body>
      </html>
