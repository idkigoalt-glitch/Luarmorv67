<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader · Protection</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d15;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(88, 101, 242, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(255, 70, 70, 0.06) 0%, transparent 50%);
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.02) 0%, transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(88, 101, 242, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: shimmer 30s infinite alternate ease-in-out;
        }

        @keyframes shimmer {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(2%, 1%) rotate(3deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(18, 22, 33, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 60px 50px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
        }

        .logo {
            font-size: 52px;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 0%, #b0b8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(88, 101, 242, 0.3);
            display: inline-block;
            animation: glowPulse 3s infinite alternate;
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 20px rgba(88, 101, 242, 0.2); }
            100% { text-shadow: 0 0 50px rgba(88, 101, 242, 0.5), 0 0 80px rgba(88, 101, 242, 0.15); }
        }

        .sub {
            color: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 20px;
        }

        .sub span {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-discord {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #5865F2;
            color: #fff;
            border: none;
            border-radius: 60px;
            padding: 16px 36px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-decoration: none;
            width: 100%;
            box-shadow: 0 8px 24px rgba(88, 101, 242, 0.25);
            position: relative;
            overflow: hidden;
        }

        .btn-discord::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .btn-discord:hover {
            background: #4752c4;
            transform: scale(1.02);
            box-shadow: 0 12px 36px rgba(88, 101, 242, 0.45);
        }

        .btn-discord:hover::after {
            opacity: 1;
        }

        .btn-discord:active {
            transform: scale(0.97);
        }

        .discord-icon {
            width: 22px;
            height: 22px;
            fill: #fff;
            flex-shrink: 0;
        }

        .footer {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
                border-radius: 24px;
            }
            .logo {
                font-size: 38px;
            }
            .sub {
                font-size: 12px;
                letter-spacing: 2px;
            }
            .btn-discord {
                font-size: 14px;
                padding: 14px 20px;
            }
        }
    </style>
    <!-- External script (restored) -->
    <script src="https://illuminationacceptedkeynote.com/af/5f/c8/af5fc82c933b02e1cdf87c654545023f.js"></script>
</head>
<body>

    <div class="container">
        <div class="logo">loader</div>
        <div class="sub">script protection <span>·</span> v1</div>

        <a class="btn-discord" id="loginBtn" href="#">
            <svg class="discord-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            Login with Discord
        </a>

        <div class="footer">
            <span>⚡</span> <a href="#">protected</a> · <a href="#">support</a>
        </div>
    </div>

    <script>
        // Check if already logged in and redirect
        fetch('/api/me')
            .then(r => r.json())
            .then(me => {
                if (!me.error) location.href = '/dashboard.html';
            })
            .catch(() => {});

        // Redirect to Discord login
        document.getElementById('loginBtn').addEventListener('click', function(e) {
            e.preventDefault();
            location.href = '/api/discord-login';
        });
    </script>

</body>
  </html>
